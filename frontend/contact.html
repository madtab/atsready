<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATSReady — Contact Us</title>
    <meta name="description" content="Get in touch with the ATSReady team. We're here to help with any questions about our ATS resume conversion service.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Fraunces:opsz,wght@9..144,700;9..144,800;9..144,900&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #0f0f12;
            --paper: #faf9f7;
            --sage: #4a6741;
            --sage-light: #e8ede6;
            --dim: #6b6a6a;
            --border: #ddd9d3;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--paper);
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px 24px;
            text-align: center;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            opacity: 0.025;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 9999;
        }

        .logo {
            font-family: 'Fraunces', serif;
            font-weight: 800;
            font-size: 1.4rem;
            letter-spacing: -0.5px;
            margin-bottom: 48px;
            animation: fadeUp 0.6s ease-out;
        }
        .logo span { color: var(--sage); }
        .logo a {
            text-decoration: none;
            color: inherit;
        }

        h1 {
            font-family: 'Fraunces', serif;
            font-weight: 900;
            font-size: clamp(2rem, 5vw, 3rem);
            line-height: 1.15;
            letter-spacing: -1px;
            margin-bottom: 20px;
            animation: fadeUp 0.6s ease-out 0.1s both;
        }
        h1 em {
            font-style: italic;
            color: var(--sage);
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--dim);
            max-width: 440px;
            line-height: 1.7;
            margin-bottom: 40px;
            animation: fadeUp 0.6s ease-out 0.2s both;
        }

        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 14px;
            max-width: 420px;
            width: 100%;
            animation: fadeUp 0.6s ease-out 0.3s both;
        }

        .form-input {
            padding: 14px 18px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.95rem;
            background: white;
            color: var(--ink);
            outline: none;
            transition: border-color 0.2s;
            width: 100%;
        }
        .form-input:focus {
            border-color: var(--sage);
        }
        .form-input::placeholder {
            color: #b0afae;
        }

        textarea.form-input {
            resize: vertical;
            min-height: 120px;
            line-height: 1.6;
        }

        .send-btn {
            padding: 14px 24px;
            background: var(--ink);
            color: white;
            border: none;
            border-radius: 100px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .send-btn:hover {
            background: var(--sage);
            transform: translateY(-1px);
        }
        .send-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .success-msg {
            display: none;
            color: var(--sage);
            font-weight: 500;
            font-size: 0.95rem;
            margin-top: 16px;
            animation: fadeUp 0.3s ease-out;
        }
        .success-msg.visible { display: block; }

        footer {
            position: fixed;
            bottom: 24px;
            font-size: 0.78rem;
            color: var(--dim);
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 500px) {
            .send-btn { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="logo"><a href="/"><span>ATSReady</span></a></div>

    <h1>Get in <em>touch</em></h1>

    <p class="subtitle">Have a question or need help? Drop us a message and we'll get back to you as soon as we can.</p>

    <div class="contact-form" id="contactForm">
        <input type="text" class="form-input" id="nameInput" placeholder="Your name" required>
        <input type="email" class="form-input" id="emailInput" placeholder="Your email" required>
        <textarea class="form-input" id="messageInput" placeholder="Your message…" required></textarea>
        <button class="send-btn" id="sendBtn" onclick="handleContact()">Send message</button>
    </div>

    <p class="success-msg" id="successMsg">Message sent. We'll get back to you shortly.</p>

    <footer>&copy; 2026 ATSReady</footer>

<script>
    function handleContact() {
        const name = document.getElementById('nameInput');
        const email = document.getElementById('emailInput');
        const message = document.getElementById('messageInput');
        const btn = document.getElementById('sendBtn');

        if (!name.value.trim()) { name.focus(); return; }
        if (!email.value.trim() || !email.value.includes('@')) { email.focus(); return; }
        if (!message.value.trim()) { message.focus(); return; }

        btn.disabled = true;
        btn.textContent = 'Sending…';

        fetch('https://formspree.io/f/mbdapzjj', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                name: name.value.trim(),
                email: email.value.trim(),
                message: message.value.trim()
            })
        })
        .then(resp => {
            if (resp.ok) {
                document.getElementById('contactForm').style.display = 'none';
                document.getElementById('successMsg').classList.add('visible');
            } else {
                throw new Error('Form submission failed');
            }
        })
        .catch(() => {
            btn.disabled = false;
            btn.textContent = 'Send message';
            alert('Something went wrong. Please try again.');
        });
    }

    // Allow Ctrl+Enter to submit from textarea
    document.getElementById('messageInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) handleContact();
    });
</script>

</body>
</html>
